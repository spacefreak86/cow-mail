[package]
name = "cow-mail"
version = "0.0.1"
authors = ["Thomas Oettli"]
edition = "2024"
license = "GPL-3.0-only"

description = "Parse, modify and serialize email messages (RFC 5322/MIME) with copy-on-write, byte-exact round-trip"
homepage = "https://github.com/spacefreak86/cow-mail/blob/master/README.md"
repository = "https://github.com/spacefreak86/cow-mail"
readme = "README.md"
categories = ["email", "parser-implementations"]
keywords = ["email", "mime", "rfc5322", "parser", "cow"]

[dependencies]
email-encoding = "0.4.2"
quoted_printable = "0.5.2"
charset = "0.1.5"
mailparse = "0.18.0"
rand = "0.10.3"
